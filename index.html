<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
     <div class="card p-4 shadow rounded" style="width: 100%; max-width: 400px;">
        <h2 class="text-center mb-4">Simple Calculator</h2>

        <input type="number" id="num1" class="form-control mb-3" placeholder="enter first number">
        <input type="number" id="num2" class="form-control mb-3" placeholder="enter second number">

        <div class="d-grid gap-2 d-md-flex justify-content-center mb-3">
            <button onclick="perform('add')" class="btn btn-success">+</button>
            <button onclick="perform('sub')" class="btn btn-success">-</button>
            <button onclick="perform('mul')" class="btn btn-success">×</button>
            <button onclick="perform('div')" class="btn btn-success">÷</button>
            <h4 class="text-center">Result: <span id="result" class="text-info">---</span></h4>
        </div>
     </div>
     <script src="script.js"></script>
</body>
</html>
